[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicap"
version = "0.0.1"
description = "Take over an interactive shell session and record command input/output in a structured format for AI to read."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pywinpty; sys_platform == 'win32'",
]

[project.scripts]
aicap = "aicap.cli:main"

[tool.setuptools.packages.find]
include = ["aicap*"]
